version: 2
updates:
  # The base runner image: GitHub stops sending jobs to a runner about 30 days
  # after a newer release, so check weekly.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
