# Build, smoke-test and publish the image to GHCR with a signed provenance
# attestation. Pull requests build and test only. The monthly run picks up
# Ubuntu package updates; Dependabot bumps the base image and the actions.
name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 1 * *"   # 1st of each month, 09:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          load: true
          provenance: false
          tags: ci-runner-image:test

      - name: Smoke test
        run: |
          docker run --rm ci-runner-image:test bash -euo pipefail -c '
            "$RUNNER_TOOL_CACHE"/go/*/x64/bin/go version
            ls "$RUNNER_TOOL_CACHE"/go/*/x64.complete
            docker compose version
            python3 -m venv /tmp/venv
            make --version | head -1
            date +%Z | grep -Ex "CST|CDT"
            /home/runner/bin/Runner.Listener --version'

      - name: Tags
        id: tags
        if: env.PUBLISH == 'true'
        run: |
          ver=$(sed -n 's|^FROM ghcr\.io/actions/actions-runner:\([0-9.]*\)@.*|\1|p' Dockerfile)
          test -n "$ver"
          echo "tags=$IMAGE:runner-$ver-$(date -u +%Y%m%d),$IMAGE:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
